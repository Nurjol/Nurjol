<svg width="900" height="8" viewBox="0 0 900 8" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f5ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff0080" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#00f5ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="900" height="2" fill="url(#line)"/>
  <rect x="0" y="2.5" width="120" height="3" rx="1.5" fill="url(#pulse)">
    <animate attributeName="x" values="-120;900" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
